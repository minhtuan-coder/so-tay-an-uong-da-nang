<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh Viên Đà Nẵng - Academic & Finance Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#10b981', // Main Mint Emerald
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Mobile App Container Frame -->
    <div class="w-full sm:max-w-[420px] h-screen sm:h-[860px] bg-emerald-50/30 sm:rounded-[40px] shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-8 sm:border-slate-800">

        <!-- Mobile Status Bar -->
        <div class="bg-white/90 backdrop-blur-md px-6 py-2.5 flex items-center justify-between text-xs font-semibold text-slate-700 shrink-0 z-40 border-b border-emerald-100/60">
            <span>09:41</span>
            <div class="w-24 h-4 bg-slate-900 rounded-full hidden sm:block"></div>
            <div class="flex items-center space-x-2 text-emerald-800">
                <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-3.5 h-3.5"></i>
            </div>
        </div>

        <!-- App Header -->
        <header id="appHeader" class="bg-white px-5 py-3.5 border-b border-emerald-100 flex items-center justify-between shrink-0 z-30 shadow-sm">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 bg-gradient-to-tr from-emerald-500 to-teal-400 text-white rounded-xl flex items-center justify-center shadow-md shadow-emerald-200">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-sm font-extrabold text-slate-800 leading-tight">Sinh Viên Đà Nẵng 🍀</h1>
                    <p class="text-[10px] font-medium text-emerald-600">Trợ lý toàn năng • Khu FPT & VKU</p>
                </div>
            </div>
            <div class="flex items-center space-x-1.5">
                <button onclick="switchTab('glossary')" class="px-2.5 py-1.5 bg-emerald-50 text-emerald-700 rounded-xl hover:bg-emerald-100 transition font-semibold text-[11px] flex items-center space-x-1 border border-emerald-200/50">
                    <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
                    <span>Thuật Ngữ</span>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Content Area -->
        <main id="mainContainer" class="flex-1 overflow-y-auto pb-24 no-scrollbar relative">
            <div class="flex items-center justify-center h-full">
                <div class="text-center space-y-2">
                    <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p class="text-xs text-slate-500">Đang tải kho tài liệu & hệ thống môn học...</p>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-emerald-100 px-2 py-2 flex items-center justify-around z-40 shadow-lg">
            <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center space-y-1 text-emerald-600 transition">
                <i data-lucide="map-pin" class="w-5 h-5"></i>
                <span class="text-[9px] font-bold">Địa Điểm</span>
            </button>
            <button onclick="switchTab('academic')" id="nav-academic" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                <span class="text-[9px] font-semibold">Học Tập</span>
            </button>
            <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[9px] font-semibold">Tài Chính</span>
            </button>
            <button onclick="switchTab('community')" id="nav-community" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="users" class="w-5 h-5"></i>

            { term: 'GPA / CPA', desc: 'GPA là điểm trung bình học kỳ. CPA là điểm trung bình tích lũy toàn khóa.', tag: 'Học Tập' },
            { term: 'OJT (On-the-Job Training)', desc: 'Học kỳ thực tập thực tế tại doanh nghiệp (kéo dài 4-8 tháng từ học kỳ 6), điểm đặc trưng của SV Đại học FPT.', tag: 'Thực Tập' },
            { term: 'RBL (Research-Based Learning)', desc: 'Phương pháp học tập dựa trên nghiên cứu khoa học tại ĐH FPT Đà Nẵng.', tag: 'ĐH FPT' }
        ];

        let currentTab = 'academic'; // Default tab set to Academic/Roadmap
        let monthlyBudget = 3500000;
        let expenses = [
            { id: 'exp_1', title: 'Tiền phòng trọ / KTX', amount: 1200000, category: 'Nhà ở' },
            { id: 'exp_2', title: 'Tiền ăn uống nửa đầu tháng', amount: 1100000, category: 'Ăn uống' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            renderTabContent();
            lucide.createIcons();
        });

        function switchTab(tab) {
            currentTab = tab;
            ['explore', 'academic', 'finance', 'community', 'glossary'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tab) btn.className = "flex flex-col items-center space-y-1 text-emerald-600 transition";
                    else btn.className = "flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition";
                }
            });
            renderTabContent();
        }

        function renderTabContent() {
            const container = document.getElementById('mainContainer');
            if (currentTab === 'explore') container.innerHTML = renderExploreView();
            else if (currentTab === 'academic') container.innerHTML = renderAcademicRoadmapView();
            else if (currentTab === 'finance') container.innerHTML = renderFinanceView();
            else if (currentTab === 'community') container.innerHTML = renderCommunityView();
            else if (currentTab === 'glossary') container.innerHTML = renderGlossaryView();
            lucide.createIcons();
        }

        function renderExploreView() {
            return `
                <div class="p-4 space-y-3.5">
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-2xl p-4 text-white shadow-md flex items-center justify-between">
                        <div>
                            <span class="px-2 py-0.5 bg-white/20 backdrop-blur-sm rounded text-[10px] font-bold uppercase">Bản Đồ ATM 2026</span>
                            <h4 class="text-xs font-extrabold mt-1">Cây ATM & PGD An Toàn Hòa Quý</h4>
                        </div>
                        <i data-lucide="shield-check" class="w-8 h-8 text-white/80"></i>
                    </div>
                    <div class="space-y-3 pt-1">
                        ${places.map(p => `
                            <div class="bg-white rounded-2xl border border-emerald-100 shadow-sm p-3 space-y-1 cursor-pointer" onclick="openDetailModal('${p.id}')">
                                <h4 class="text-xs font-bold text-slate-800">${p.name}</h4>
                                <p class="text-[11px] text-slate-500">${p.address}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- NEW ROADMAP VIEW (4-YEAR MAJOR ROADMAP FOR FPT UNIVERSITY DANANG) ---
        function renderAcademicRoadmapView() {
            const currentMajor = majorRoadmaps.find(m => m.id === selectedMajorId) || majorRoadmaps[0];

            return `
                <div class="p-4 space-y-4 text-xs">
                    <!-- Title Banner -->
                    <div class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm space-y-2">
                        <div class="flex items-center space-x-2 text-emerald-600 font-bold">
                            <i data-lucide="compass" class="w-4.5 h-4.5"></i>
                            <h3 class="text-sm text-slate-800">Lộ Trình Học Tập 4 Năm Đại Học</h3>
                        </div>
                        <p class="text-[11px] text-slate-500 leading-relaxed">Chi tiết môn học & khung chương trình từng học kỳ chuẩn Đại học FPT Đà Nẵng.</p>
                    </div>

                    <!-- Major Selector Tabs -->
                    <div class="space-y-1.5">
                        <label class="block font-bold text-slate-700 text-[11px]">Chọn Ngành Học Của Bạn:</label>
                        <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 no-scrollbar text-[10px]">
                            ${majorRoadmaps.map(m => `
                                <button onclick="selectMajor('${m.id}')" class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition flex items-center space-x-1 ${selectedMajorId === m.id ? 'bg-emerald-600 text-white shadow-md shadow-emerald-100' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'}">
                                    <i data-lucide="${m.icon}" class="w-3.5 h-3.5"></i>
                                    <span>${m.code}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Selected Major Info Box -->
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 rounded-2xl shadow-sm space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-0.5 bg-white/20 backdrop-blur-sm rounded text-[9px] font-extrabold uppercase">Khung Chương Trình Chuẩn FPT</span>
                            <span class="text-[10px] font-bold text-emerald-100">8 - 9 Học Kỳ</span>
                        </div>
                        <h4 class="text-sm font-extrabold mt-1">${currentMajor.name}</h4>
                        <p class="text-[10px] text-emerald-100 leading-relaxed">${currentMajor.description}</p>
                    </div>

                    <!-- Timeline Semesters Breakdown -->
                    <div class="space-y-3 pt-1">
                        <h4 class="font-bold text-slate-800 text-xs flex items-center space-x-1.5">
                            <i data-lucide="milestone" class="w-4 h-4 text-emerald-600"></i>
                            <span>Lộ Trình Từng Học Kỳ (Semester Breakdown)</span>
                        </h4>

                        <div class="relative border-l-2 border-emerald-300/70 ml-2 pl-4 space-y-3.5">
                            ${currentMajor.semesters.map((s, index) => `
                                <div class="relative group">
                                    <!-- Timeline Node Circle -->
                                    <div class="absolute -left-[23px] top-1.5 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white shadow-sm group-hover:scale-125 transition"></div>
                                    
                                    <!-- Card Content -->
                                    <div class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm space-y-1 hover:border-emerald-300 transition">
                                        <div class="flex items-center justify-between">
                                            <span class="font-bold text-emerald-800 text-xs">${s.sem}</span>
                                            <span class="text-[9px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-bold border border-emerald-200/50">Kỳ ${index + 1}</span>
                                        </div>
                                        <p class="text-[11px] text-slate-700 font-medium leading-relaxed pt-0.5">${s.subjects}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFinanceView() {
            return `<div class="p-4 text-xs"><div class="bg-white p-4 rounded-2xl border border-emerald-100 font-bold">Quản lý tài chính cá nhân sinh viên</div></div>`;
        }
        function renderCommunityView() { return `<div class="p-4 text-xs"><div class="bg-white p-4 rounded-2xl border border-emerald-100 font-bold">Diễn đàn kết nối sinh viên</div></div>`; }
        function renderGlossaryView() { return `<div class="p-4 text-xs"><div class="bg-white p-4 rounded-2xl border border-emerald-100 font-bold">Sổ tay thuật ngữ đại học</div></div>`; }

        function selectMajor(id) {
            selectedMajorId = id;
            renderTabContent();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('-translate-y-20', 'opacity-0'), 2500);
        }
        function openDetailModal(id) { document.getElementById('detailModal').classList.remove('hidden'); }
        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }
    </script>
</body>

</html>
